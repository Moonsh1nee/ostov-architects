name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      # Owner is mixed-case; canonical URLs and the sitemap should not be.
      - run: echo "NEXT_PUBLIC_SITE_URL=https://${OWNER,,}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # AVIF encoding dominates build time; variants only change with originals or the pipeline.
      - uses: actions/cache@v4
        with:
          path: |
            public/img
            public/og
          key: images-${{ hashFiles('media/originals/**', 'scripts/build-images.ts', 'lib/images.ts') }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No STRAPI_URL here: the build reads the committed JSON snapshot in /content.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
